[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cm2"
version = "0.1.1"
description = "ffmpeg-only CLI to scan, test, and stream RTSP/ONVIF cameras and webcams (M3U8 + MJPEG-over-HTTP)"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "questionary>=2.0",
    "rich>=13.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "onvif-zeep-async>=4.2",
]

[project.scripts]
cm2 = "cm2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
