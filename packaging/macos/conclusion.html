<html><body style="font-family: -apple-system, sans-serif">
<h2>cm2 is installed</h2>
<p>If you kept <i>Add cm2 to PATH automatically</i>, open a new Terminal and run <code>cm2</code>.</p>
<p>If you unticked it, run <code>/usr/local/cm2/cm2</code>, or add it to your PATH yourself:</p>
<pre>echo 'export PATH="/usr/local/cm2:$PATH"' &gt;&gt; ~/.zshrc</pre>
</body></html>
