<h2>cm2</h2>
<p>Scan, test and stream RTSP/ONVIF cameras and webcams. ffmpeg is included.</p>
<p><b>PATH environment variable:</b> by default the installer adds <code>cm2</code> to your PATH
automatically. To set it up manually instead, click <b>Customize</b> on the Installation Type
step and untick <i>Add cm2 to PATH automatically</i>.</p>
</body></html>
